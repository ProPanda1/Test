<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1018"><title>Squad Rush: Three Lane Assault</title><body style="margin:0;background:#08111d;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh"><main id="status" style="padding:24px;text-align:center"><h1 style="margin:0 0 8px">Three Lane Assault</h1><p style="margin:0;color:#a6b6c8">Loading the live game…</p></main><script>(async()=>{const files=['three-lane-v2-1.txt','three-lane-v2-2.txt','three-lane-v2-3.txt','three-lane-v2-4.txt'];const parts=await Promise.all(files.map(f=>fetch(f+'?release=three-lane-v2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' failed: '+r.status);return r.text()})));const DATA=parts.map((s,i)=>i?s.replace(/^SQUAD_RUSH_THREE_LANE_GZIP_BASE64_PART_\d_OF_4\s*/,'').trim():s.trim()).join('');const bytes=Uint8Array.from(atob(DATA),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()})().catch(e=>{document.getElementById('status').innerHTML='<h1>Three Lane Assault</h1><p>Unable to load the game.</p><pre style="white-space:pre-wrap;text-align:left">'+String(e)+'</pre>'})</script>
